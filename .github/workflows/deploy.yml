name: Deploy Astro site

on:
  push:
    branches:
      - reference-background-refinement-20260806-1532
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check deployment verification
        run: node --test scripts/validation/deployment.test.mjs

      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published revision, routes and assets
        timeout-minutes: 8
        run: node scripts/validation/deployment.mjs verify https://www.mdanikhasan.com/
