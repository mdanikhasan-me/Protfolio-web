<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="board-title board-desc">
  <title id="board-title">KINETIC LEDGER — TYPOGRAPHY STUDY</title>
  <desc id="board-desc">Eight hierarchy and behavior tests using fonts already present in the repository; wording is non-public study copy.</desc>
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="microShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#171721" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#2447FF"/>
      <stop offset=".48" stop-color="#5B2A86"/>
      <stop offset="1" stop-color="#FF5C35"/>
    </linearGradient>
    
  </defs>
  <style>
    .kicker,.folio,.label,.micro,.state { font-family: "IBM Plex Mono", "Cascadia Mono", monospace; letter-spacing: .12em; }
    .title,.display,.word { font-family: "Arial Narrow", "Inter Tight", Arial, sans-serif; font-weight: 760; }
    .kicker { font-size: 19px; fill: #2447FF; }
    .folio { font-size: 14px; fill: #716F7B; }
    .title { font-size: 54px; fill: #171721; letter-spacing: -.035em; }
    .subtitle { font: 22px Arial, sans-serif; fill: #716F7B; }
    .label { font-size: 13px; fill: #171721; }
    .micro { font-size: 11px; fill: #716F7B; }
    .state { font-size: 14px; fill: #171721; }
    .display { fill: #171721; letter-spacing: -.07em; }
  </style>
  <rect width="1920" height="1080" fill="#F4F0E8"/>
  <rect width="1920" height="1080" fill="url(#microGrid)"/>
  
